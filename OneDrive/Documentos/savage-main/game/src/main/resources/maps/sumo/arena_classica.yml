# Arena Clássica - Mapa padrão de Sumo
# Plataforma circular no centro com quedas em todos os lados

name: "Arena Clássica"
id: 2

# Spawn central onde os jogadores nascem ao entrar
spawn:
  x: 0
  y: 65
  z: 0
  yaw: 0.0
  pitch: 0.0

# Spawn da equipe vermelha (lado leste)
red_spawn:
  x: 8
  y: 65
  z: 0
  yaw: -90.0
  pitch: 0.0

# Spawn da equipe azul (lado oeste)
blue_spawn:
  x: -8
  y: 65
  z: 0
  yaw: 90.0
  pitch: 0.0

# Configurações da borda do mundo
border:
  center:
    x: 0
    z: 0
  size: 80

# Configurações específicas do evento
settings:
  min_y: 40  # Jogadores morrem ao cair abaixo de Y=40
  max_players: 12
  min_players: 2
