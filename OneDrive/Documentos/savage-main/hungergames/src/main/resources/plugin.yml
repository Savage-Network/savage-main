name: SavageHungerGames
version: 1.0.0-SNAPSHOT
main: com.minecraft.savagemc.hungergames.HungerGamesPlugin
author: SavageMC Team
description: HungerGames plugin for SavageMC network
website: https://savagemc.com

# API version
api-version: 1.20
depend: [SavageCore]

# Plugin permissions
permissions:
  # Basic permissions
  hungergames.command.help:
    description: Show help for HungerGames commands
    default: true
  hungergames.command.kit:
    description: Select a kit
    default: true
  hungergames.command.kits:
    description: List available kits
    default: true
  hungergames.command.stats:
    description: Show your statistics
    default: true
  hungergames.command.spectate:
    description: Spectate games
    default: true

  # Game management permissions
  hungergames.command.start:
    description: Start HungerGames games
    default: op
  hungergames.command.stop:
    description: Stop HungerGames games
    default: op
  hungergames.command.arena:
    description: Manage arenas
    default: op

  # Feast management
  hungergames.command.feast:
    description: Manage feast
    default: op

  # Kit permissions
  hungergames.kit.*:
    description: Access to all kits
    default: op
  hungergames.kit.none:
    description: Access to no kit
    default: true

  # Administrative permissions
  hungergames.admin.forcekit:
    description: Force kits for players
    default: op
  hungergames.admin.feast:
    description: Full feast control
    default: op
  hungergames.admin.arena:
    description: Full arena control
    default: op
  hungergames.admin.stats:
    description: View other players' stats
    default: op
  hungergames.admin:
    description: Full HungerGames administration
    default: op

# Commands
commands:
  # Basic commands
  help:
    description: "Show HungerGames help"
    usage: "/help"
    permission: hungergames.command.help
  kit:
    description: "Select a kit"
    usage: "/kit <name>"
    permission: hungergames.command.kit
  kits:
    description: "List available kits"
    usage: "/kits [detailed]"
    permission: hungergames.command.kits
  stats:
    description: "Show statistics"
    usage: "/stats [player]"
    permission: hungergames.command.stats
  spectate:
    description: "Spectate a game"
    usage: "/spectate"
    permission: hungergames.command.spectate

  # Game management
  start:
    description: "Start HungerGames game"
    usage: "/start"
    permission: hungergames.command.start
  stop:
    description: "Stop HungerGames game"
    usage: "/stop"
    permission: hungergames.command.stop
  arena:
    description: "Manage arenas"
    usage: "/arena <subcommand> [args...]"
    permission: hungergames.command.arena
  feast:
    description: "Manage feast"
    usage: "/feast <subcommand>"
    permission: hungergames.command.feast

  # Administrative commands
  forcekit:
    description: "Force kit for player"
    usage: "/forcekit <player> <kit>"
    permission: hungergames.admin.forcekit

# Configuration
softdepend: [PlaceholderAPI, Vault]

# Plugin metadata
folia-supported: true
libraries: []
