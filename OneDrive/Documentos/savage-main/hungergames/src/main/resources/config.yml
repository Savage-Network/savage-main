# SavageMC HungerGames Configuration
# Modern HungerGames system with full compatibility

# Game Settings
game:
  # Minimum players to start a game
  minimum-players: 2
  # Maximum players per game
  maximum-players: 24
  # Auto-start when minimum players reached
  auto-start: true
  # Game duration in minutes (0 = unlimited)
  max-duration: 30
  # Invincibility duration in seconds
  invincibility-duration: 60
  # Feast time in seconds after game start
  feast-time: 300
  # Final battle time in seconds
  final-battle-time: 900

# Arena Settings
arena:
  # Default arena to load
  default-arena: "default"
  # Auto-select random arena
  random-selection: true
  # Validate arenas on load
  validate-on-load: true

# Kit Settings
kits:
  # Enable kit selection
  enabled: true
  # Allow multiple kits
  double-kit: false
  # Kit cooldown in seconds (0 = disabled)
  cooldown: 0
  # Force kit selection before game
  require-selection: false

# World Settings
world:
  # World name for games
  game-world: "world"
  # Auto-save world
  auto-save: false
  # Reset world after game
  reset-after-game: true
  # Storage directory for maps
  storage-directory: "maps/"

# Performance Settings
performance:
  # Entity cleanup interval in ticks
  cleanup-interval: 12000
  # Stats update interval in ticks
  stats-interval: 6000
  # Memory optimization threshold (percentage)
  memory-threshold: 80

# Celebration Settings
celebrations:
  # Enable victory celebrations
  enabled: true
  # Celebration duration in seconds
  duration: 15
  # Fireworks enabled
  fireworks: true
  # Particle effects enabled
  particles: true

# Database Configuration
database:
  type: 'POSTGRESQL'
  postgresql:
    enabled: true
    # Will use SavageCore database connection
    # Override if needed:
    # url: 'jdbc:postgresql://host:port/database'
    # username: 'user'
    # password: 'pass'

# Redis Configuration
redis:
  # Will use SavageCore Redis connection
  # Override if needed:
  # host: 'localhost'
  # port: 6379
  # password: 'password'

# Maintenance Mode
maintenance:
  enabled: false
  message: "§cServidor em manutenção! Tente novamente mais tarde."
  allow-staff: true
