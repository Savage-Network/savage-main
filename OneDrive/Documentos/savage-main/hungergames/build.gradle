plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id 'net.minecrell.plugin-yml.bukkit' version "0.5.2"
}

group 'com.minecraft.hungergames'
version '1.0.0-SNAPSHOT'

compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')
    implementation project(':core-bukkit')

    compileOnly files("../libs/panda-api.jar")
    compileOnly files("../libs/panda-server.jar")
    compileOnly files("../libs/bungee.jar")
    compileOnly files("../libs/ProtocolLib.jar")

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    compileOnly group: 'redis.clients', name: 'jedis', version: '5.1.2'
    compileOnly group: 'org.apache.commons', name: 'commons-pool2', version: '2.11.1'
    compileOnly group: 'com.google.code.gson', name: 'gson', version: '2.10.1'
    compileOnly group: 'com.google.guava', name: 'guava', version: '32.1.2-jre'
    compileOnly group: 'org.apache.commons', name: 'commons-lang3', version: '3.13.0'
    compileOnly group: 'org.yaml', name: 'snakeyaml', version: '2.1'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}

bukkit {
    name = 'HungerGames'
    main = 'com.minecraft.hungergames.HungerGames'
    version = '1.0.0-' + gitVersion()
    website = 'www.fyremc.com.br'
    description = 'HungerGames bukkit plugin based on core and core-bukkit.'
}

static String gitVersion() {
    return 'alpha'
}

shadowJar {
    archiveClassifier = null
}