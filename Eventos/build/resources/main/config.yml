# ============================================
# Eventos - Configuração (BungeeCord / Spigot 1.8.9)
# ============================================

# ---------- Banco de dados ----------
# tipo: sqlite (arquivo local) ou mysql (servidor remoto)
database:
  type: "sqlite"
  # SQLite: nome do arquivo na pasta do plugin (ignorado se type for mysql)
  sqlite:
    file: "eventos.db"
  # MySQL/MariaDB: preencha quando type for mysql
  mysql:
    host: "localhost"
    port: 3306
    database: "eventos"
    username: "root"
    password: ""

# Nome do servidor de lobby no BungeeCord (para enviar jogadores após evento)
lobby-server: "lobby"

# Nome deste servidor de eventos no BungeeCord (para sinalizar reinício ao proxy)
nome-servidor-eventos: "eventos"

# Tempo em segundos na área do bolo antes de enviar todos ao lobby
tempo-area-bolo-segundos: 15

# Tempo da contagem regressiva inicial (em segundos) antes de iniciar o evento
contagem-regressiva-inicial: 10

# Tempo para iniciar o evento: countdown em segundos quando há jogadores suficientes (ex: 300 = 5 min)
tempo-para-iniciar-segundos: 300
# Mínimo de jogadores online (com eventos.jogar) para o countdown rodar; ao atingir, inicia automaticamente o tempo acima
min-jogadores-para-auto-inicio: 5

# Tempo de relog: jogadores com permissão eventos.vip têm este tempo (em minutos) para reconectar após sair durante o evento
relog-time-minutos: 5
# Tempo de invencibilidade no início do evento (em segundos) - jogadores não tomam dano neste período
tempo-invencibilidade-segundos: 10

# Moedas: recompensa por vitória e por participação
moedas:
  vitoria: 100
  participacao: 25
  kill: 5

# Mensagens
mensagens:
  evento-iniciando: "&aO evento inicia em &e%tempo% &asegundos!"
  countdown-iniciado: "&aCountdown iniciado! Evento em &e%tempo% &asegundos."
  evento-iniciado: "&aO evento começou! Boa sorte!"
  evento-finalizado: "&6O evento terminou! Vencedor: &e%vencedor%"
  time-ganhou: "&aTIME Ganhou o jogo."
  indo-para-bolo: "&eIndo para a área de celebração..."
  indo-para-lobby: "&e."
  servidor-reiniciando: "&cServidor reiniciando. Até já!"
  espectador: "&7Você morreu! Modo espectador ativado."
  relog-voltou: "&aVocê voltou a tempo! Bem-vindo de volta."
  titulo-contagem: "&e%tempo%"
  join-titulo: "&b&lEVENTOS"
  join-subtitulo: "&7Bem-vindo a sala de evento!"

# Pasta de schematics (relativa à pasta do plugin)
pasta-schematics: "schematics"

# Nome do schematic do mapa do evento (sem extensão)
schematic-evento: "mapa_evento"

# Nome do schematic da área do bolo
schematic-bolo: "area_bolo"

# Coordenadas de spawn na área do bolo (quando não usar schematic ou como fallback)
area-bolo:
  world: "world"
  x: 0
  y: 100
  z: 0
  yaw: 0
  pitch: 0
  # Raio da plataforma de PEDRA (só usada se gerar-bolo-automatico for false)
  raio-plataforma: 5
  # Geração automática: quando não colar schematic, gerar plataforma de blocos de bolo
  gerar-bolo-automatico: true
  # Formato: "cruz" (5x5 em cruz, 21 blocos) ou "retangulo" (3x2, 6 blocos)
  formato-bolo: "cruz"
  # Colocar camada de vidro embaixo dos bolos
  base-vidro: true

# Coordenadas de spawn do evento (onde colar o schematic)
spawn-evento:
  world: "world"
  x: 0
  y: 64
  z: 0

# Ao iniciar o servidor: garantir um mundo plano (superflat). Se o mundo não existir, será criado plano.
mundo-plano:
  ativo: true
  nome: "world"

# Habilitar eventos por clans (times)
eventos-clans: false

# Tipo do evento: SOLO, DUPLAS, TRIO ou PANELA (também definível por /lm tipo ou /time)
evento-tipo: SOLO

# Nome padrão do evento (usado ao dar /start sem argumentos; também definível por /lm nome)
evento-nome-padrao: Evento
# Nome do evento "resenha/padrão" quando usar /lm resenha ou /lm padrao
evento-resenha-nome: "SPARTA"

# Máximo de jogadores por clan no evento (ajustado automaticamente ao usar /lm tipo duplas|trio|panela)
max-jogadores-por-clan: 4

# Máximo de jogadores no evento (usado na scoreboard: Jogadores: atual/max)
max-jogadores-evento: 80

# Site exibido na scoreboard do evento
scoreboard-site: "§bspartamc.com.br"

# Variáveis (editáveis por /var) - usadas na scoreboard, chat, PvP e dano
# event.name = nome no topo da scoreboard
# event.chat = true/false - permite chat durante o evento
# event.pvp = true/false - permite dano entre jogadores
# event.damage = true/false - permite dano (queda, lava, fogo, etc.)
# event.hunger = true/false - jogadores perdem fome durante o evento
# event.blockplace = true/false - permite colocar blocos durante o evento
# event.min_players = mínimo de jogadores para countdown iniciar (número)
# event.max_players = máximo de jogadores exibido na scoreboard (número)
# event.tempo_iniciar = segundos do countdown quando atinge min players (ex: 300 = 5 min)
# event.tempo_bolo = segundos na área do bolo antes de enviar ao lobby
# event.contagem_inicial = segundos da contagem regressiva antes do evento (10, 9, 8...)
# event.invencibilidade = segundos de invencibilidade no início do evento
# event.relog_minutos = minutos para reconectar (eventos.vip) após sair
# event.site = site exibido na scoreboard (texto com § para cores)
# event.moedas_vitoria = moedas por vitória
# event.moedas_participacao = moedas por participação
# event.moedas_kill = moedas por kill
# event.lobby_server = servidor de lobby no BungeeCord (para enviar após evento)
# event.join_titulo = título ao entrar no servidor (use & para cores)
# event.join_subtitulo = subtítulo ao entrar
# event.msg_espectador = mensagem quando morre (modo espectador)
# event.msg_indo_bolo = mensagem ao teleportar para área do bolo
# event.msg_relog_voltou = mensagem quando volta a tempo (relog VIP)
# event.msg_evento_iniciando = mensagem countdown (use %tempo% para segundos)
# event.msg_countdown_iniciado = mensagem ao iniciar countdown (%tempo%)
# event.msg_evento_iniciado = mensagem quando o evento começa
# event.msg_time_ganhou = mensagem quando time vence
# event.msg_evento_finalizado = mensagem fim do evento (use %vencedor%)
# event.eventos_clans = true/false - eventos por times (clans)
# event.max_por_clan = máximo de jogadores por time
# event.nome_resenha = nome do evento ao usar /lm resenha
# event.auto_respawn = true/false - auto-respawn ao morrer no evento
# event.titulo_contagem = título na contagem regressiva (use %tempo%)
# event.titulo_contagem_subtitulo = subtítulo na contagem
# event.nome_servidor_eventos = nome deste servidor no BungeeCord (sinalizar reinício)
variables:
  event.name: "EVENTO"
  event.chat: "true"
  event.pvp: "true"
  event.damage: "true"
  event.hunger: "true"
  event.blockplace: "false"
  event.min_players: "5"
  event.max_players: "80"
  event.tempo_iniciar: "300"
  event.tempo_bolo: "15"
  event.contagem_inicial: "10"
  event.invencibilidade: "10"
  event.relog_minutos: "5"
  event.site: "§6spartamc.com.br"
  event.moedas_vitoria: "100"
  event.moedas_participacao: "25"
  event.moedas_kill: "5"
  event.lobby_server: "lobby"
  event.join_titulo: "&b&lEVENTOS"
  event.join_subtitulo: "&7Bem-vindo a sala de evento!"
  event.msg_espectador: "&7Você morreu! Modo espectador ativado."
  event.msg_indo_bolo: "&eIndo para a área de celebração..."
  event.msg_relog_voltou: "&aVocê voltou a tempo! Bem-vindo de volta."
  event.msg_evento_iniciando: "&aO evento inicia em &e%tempo% &asegundos!"
  event.msg_countdown_iniciado: "&aCountdown iniciado! Evento em &e%tempo% &asegundos."
  event.msg_evento_iniciado: "&aO evento começou! Boa sorte!"
  event.msg_time_ganhou: "&aTIME Ganhou o jogo."
  event.msg_evento_finalizado: "&6O evento terminou! Vencedor: &e%vencedor%"
  event.eventos_clans: "false"
  event.max_por_clan: "4"
  event.nome_resenha: "SPARTA"
  event.auto_respawn: "true"
  event.titulo_contagem: "&e%tempo%"
  event.titulo_contagem_subtitulo: "&7Prepare-se!"
  event.nome_servidor_eventos: "eventos"

# 5 eventos predefinidos - use /lm evento list e /lm evento <1-5> para selecionar
eventos-predefinidos:
  - nome: "Guerra dos Clans"
    tipo: PANELA
  - nome: "Duplas Ranked"
    tipo: DUPLAS
  - nome: "Solo Survival"
    tipo: SOLO
  - nome: "Trio Cup"
    tipo: TRIO
  - nome: "Panela Masters"
    tipo: PANELA
