name: Eventos
version: '${version}'
main: com.minecraft.arcade.eventos.Eventos
api-version: '1.8'
description: Eventos Savage — GUI e scoreboard no estilo hub (§7·§f), espectador, Bungee.
author: Zrfa

commands:
  lm:
    description: Define o evento (nome, tipo, parar, status)
    usage: /lm [nome|tipo|parar|status]
  start:
    description: Inicia o evento
    usage: /start [nome do evento]
  time:
    description: Define o tipo do evento (solo, duplas, trio, panela)
    usage: /time <solo|duplas|trio|panela>
  tempo:
    description: Tempo para iniciar o evento (countdown em segundos)
    usage: /tempo <segundos|start|parar>
  evtreload:
    description: Volta ao padrão embutido (variáveis /var em RAM são resetadas)
    usage: /evtreload
  grupo:
    description: Adiciona um jogador ao seu grupo (por nick)
    usage: /grupo <nick> ou /grupo sair
  var:
    description: "Define ou consulta variáveis do evento (ex. event.name para scoreboard)"
    usage: /var <chave> [valor]
  evento:
    description: Contagem, kills, ranking, medalhas e pré-visualização da tag (/evento entrar | kills | top | medalhas | tag)
    usage: /evento <entrar|kills|top|medalhas|tag>
  espectador:
    description: Abre o menu de espectador (teleportar / ir ao lobby)
    usage: /espectador

permissions:
  eventos.admin:
    description: Acesso total aos comandos de evento
    default: op
  eventos.jogar:
    description: Pode participar dos eventos
    default: true
  eventos.spectator:
    description: Permissão para modo espectador pós-morte
    default: true
  eventos.vip:
    description: VIP - tempo para reconectar após sair durante o evento (relog time)
    default: false

outgoing-channels:
  - BungeeCord
